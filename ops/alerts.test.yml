# Модульні тести правил: вхідні ряди задано вручну, перевіряється, коли й чи спрацює сповіщення
rule_files: [alerts.rules.yml]
evaluation_interval: 1m

tests:
  - name: refresh-токен використано вдруге (ряд існував із нуля)
    interval: 15s
    input_series:
      - series: 'greenhouse_audit_events_total{action="refresh.reuse",outcome="revoked"}'
        values: '0x20 1x40'                     # 5 хв тиші, далі одна подія
    alert_rule_test:
      - { eval_time: 4m, alertname: RefreshTokenReuse, exp_alerts: [] }
      - eval_time: 7m
        alertname: RefreshTokenReuse
        exp_alerts:
          - exp_labels: { severity: page, action: refresh.reuse, outcome: revoked }
            exp_annotations: { summary: "Повторно пред’явлено використаний refresh-токен" }

  - name: пастка — ряд, що з’явився одразу зі значенням 1, події не показує
    interval: 15s
    input_series:
      - series: 'greenhouse_audit_events_total{action="refresh.reuse",outcome="revoked"}'
        values: '_x20 1x40'                     # до 5-ї хвилини ряду немає, далі він уже дорівнює 1
    alert_rule_test:
      - { eval_time: 7m, alertname: RefreshTokenReuse, exp_alerts: [] }

  - name: тиша після перезапуску відліковується від старту процесу
    interval: 15s
    input_series:
      - series: 'process_start_time_seconds{instance="backend:3000"}'
        values: '0x100'                         # процес стартував у момент 0
      - series: 'greenhouse_last_reading_timestamp_seconds{instance="backend:3000"}'
        values: '0x100'                         # показань не було жодного
    alert_rule_test:
      - { eval_time: 4m, alertname: NoReadings, exp_alerts: [] }
      - eval_time: 6m
        alertname: NoReadings
        exp_alerts:
          - exp_labels: { severity: page, instance: "backend:3000" }
            exp_annotations: { summary: "Жодного показання понад 5 хв" }

  - name: показання йдуть, потім припиняються
    interval: 15s
    input_series:
      - series: 'process_start_time_seconds{instance="backend:3000"}'
        values: '0x200'
      - series: 'greenhouse_last_reading_timestamp_seconds{instance="backend:3000"}'
        values: '0+15x40 600x160'               # час останнього показання росте до 600 с і зупиняється
    alert_rule_test:
      - { eval_time: 8m, alertname: NoReadings, exp_alerts: [] }
      - { eval_time: 14m, alertname: NoReadings, exp_alerts: [] }
      - eval_time: 16m
        alertname: NoReadings
        exp_alerts:
          - exp_labels: { severity: page, instance: "backend:3000" }
            exp_annotations: { summary: "Жодного показання понад 5 хв" }

  - name: 2 % помилок після двох годин норми — швидкий поріг спрацьовує, коли довге вікно накопичить 1,44 %
    interval: 1m
    input_series:
      - series: 'greenhouse_http_request_seconds_count{status="200"}'
        values: '0+100x120 12098+98x120'        # 100 запитів за хвилину, з 120-ї хвилини 98 успішних
      - series: 'greenhouse_http_request_seconds_count{status="500"}'
        values: '0x120 2+2x120'                 # помилок немає, з 120-ї хвилини — 2 за хвилину (2 %)
    alert_rule_test:
      - { eval_time: 155m, alertname: ApiBudgetFastBurn, exp_alerts: [] }     # 35 хв інциденту: 1,2 % за годину
      - eval_time: 170m                                                        # 50 хв інциденту: 1,7 % за годину
        alertname: ApiBudgetFastBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "API витрачає бюджет помилок у 14,4 раза швидше за норму" }

  - name: повна відмова API помітна за хвилини, а не за години
    interval: 1m
    input_series:
      - series: 'greenhouse_http_request_seconds_count{status="200"}'
        values: '0+100x120 12000x20'            # з 120-ї хвилини успішних відповідей немає
      - series: 'greenhouse_http_request_seconds_count{status="500"}'
        values: '0x120 100+100x20'              # усі запити закінчуються помилкою
    alert_rule_test:
      - { eval_time: 120m, alertname: ApiBudgetFastBurn, exp_alerts: [] }
      - eval_time: 125m
        alertname: ApiBudgetFastBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "API витрачає бюджет помилок у 14,4 раза швидше за норму" }

  - name: 1 % помилок не будить швидкий поріг, але через 3,6 год вичерпує повільний
    interval: 1m
    input_series:
      - series: 'greenhouse_http_request_seconds_count{status="200"}'
        values: '0+100x420 42099+99x300'        # 7 год норми, далі 99 успішних із 100
      - series: 'greenhouse_http_request_seconds_count{status="500"}'
        values: '0x420 1+1x300'
    alert_rule_test:
      - { eval_time: 570m, alertname: ApiBudgetSlowBurn, exp_alerts: [] }     # 150 хв інциденту
      - eval_time: 660m                                                        # 240 хв інциденту
        alertname: ApiBudgetSlowBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "API витрачає бюджет помилок у 6 разів швидше за норму" }
      - { eval_time: 660m, alertname: ApiBudgetFastBurn, exp_alerts: [] }

  - name: частка відхилених 10 % тримається понад 10 хв
    interval: 1m
    input_series:
      - series: 'greenhouse_readings_total{result="stored"}'
        values: '0+90x60'
      - series: 'greenhouse_readings_total{result="rejected"}'
        values: '0+10x60'
    alert_rule_test:
      - { eval_time: 8m, alertname: RejectedShareHigh, exp_alerts: [] }       # умова виконується, але ще не 10 хв
      - eval_time: 25m
        alertname: RejectedShareHigh
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "Понад 5 % повідомлень відхиляють: ймовірно, змінився формат" }

  - name: брокер відпав на дві хвилини
    interval: 15s
    input_series:
      - series: 'greenhouse_broker_connected{instance="backend:3000"}'
        values: '1x20 0x20 1x20'
    alert_rule_test:
      - { eval_time: 6m, alertname: BrokerDisconnected, exp_alerts: [] }      # щойно відпав, ще не 2 хв
      - eval_time: 8m
        alertname: BrokerDisconnected
        exp_alerts:
          - exp_labels: { severity: page, instance: "backend:3000" }
            exp_annotations: { summary: "Сервер не бачить брокера понад 2 хв: показання не надходять" }
      - { eval_time: 12m, alertname: BrokerDisconnected, exp_alerts: [] }     # повернувся

  - name: IngestSlow — повільніших за 0,1 с 6 %, 95-й процентиль над межею кошика
    interval: 1m
    input_series:
      - series: 'greenhouse_ingest_seconds_bucket{le="0.05"}'
        values: '0+80x60'
      - series: 'greenhouse_ingest_seconds_bucket{le="0.1"}'
        values: '0+94x60'                       # із кожних 100 повідомлень 94 вкладаються в 0,1 с
      - series: 'greenhouse_ingest_seconds_bucket{le="0.5"}'
        values: '0+100x60'
      - series: 'greenhouse_ingest_seconds_bucket{le="+Inf"}'
        values: '0+100x60'
    alert_rule_test:
      - { eval_time: 8m, alertname: IngestSlow, exp_alerts: [] }              # умова виконується, але ще не 10 хв
      - eval_time: 25m
        alertname: IngestSlow
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "95-й процентиль опрацювання повідомлення понад 100 мс" }

  - name: IngestSlow мовчить, коли повільніших за 0,1 с лише 4 %
    interval: 1m
    input_series:
      - series: 'greenhouse_ingest_seconds_bucket{le="0.05"}'
        values: '0+80x60'
      - series: 'greenhouse_ingest_seconds_bucket{le="0.1"}'
        values: '0+96x60'
      - series: 'greenhouse_ingest_seconds_bucket{le="0.5"}'
        values: '0+100x60'
      - series: 'greenhouse_ingest_seconds_bucket{le="+Inf"}'
        values: '0+100x60'
    alert_rule_test:
      - { eval_time: 25m, alertname: IngestSlow, exp_alerts: [] }

  - name: відхилені вебхуки — спрацьовує лише екземпляр із 60 відхиленнями за 5 хв, а не з 10
    interval: 15s
    input_series:
      - series: 'greenhouse_audit_events_total{action="webhook",outcome="rejected",instance="a"}'
        values: '0+3x40'                        # 12 за хвилину
      - series: 'greenhouse_audit_events_total{action="webhook",outcome="rejected",instance="b"}'
        values: '0+0.5x40'                      # 2 за хвилину
    alert_rule_test:
      - eval_time: 9m
        alertname: WebhookRejectedSpike
        exp_alerts:
          - exp_labels: { severity: ticket, action: webhook, outcome: rejected, instance: a }
            exp_annotations: { summary: "Понад 20 відхилених вебхуків за 5 хв" }

  - name: тривогу не доставлено — push зі статусом expired (ряд існував із нуля)
    interval: 1m
    input_series:
      - series: 'greenhouse_push_total{result="sent"}'
        values: '0+4x20'
      - series: 'greenhouse_push_total{result="expired"}'
        values: '0x5 1x15'                      # одна тривога спливла на 6-й хвилині
    alert_rule_test:
      - { eval_time: 4m, alertname: PushAlertLost, exp_alerts: [] }
      - eval_time: 7m
        alertname: PushAlertLost
        exp_alerts:
          - exp_labels: { severity: page, result: expired }
            exp_annotations: { summary: "Тривогу не доставлено: expired" }

  - name: 0,2 % помилок — завдання (ticket) з’являється через півтори доби, а не будить уночі
    interval: 1m
    input_series:
      - series: 'greenhouse_http_request_seconds_count{status="200"}'
        values: '0+100x4320 432000+99.8x2880'   # 3 доби норми, далі 99,8 успішних зі 100
      - series: 'greenhouse_http_request_seconds_count{status="500"}'
        values: '0x4320 0.2+0.2x2880'
    alert_rule_test:
      - { eval_time: 6120m, alertname: ApiBudgetTicket, exp_alerts: [] }      # 30 год інциденту
      - eval_time: 6720m                                                       # 40 год інциденту
        alertname: ApiBudgetTicket
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations: { summary: "API повільно виходить за бюджет помилок" }
      - { eval_time: 6720m, alertname: ApiBudgetFastBurn, exp_alerts: [] }
      - { eval_time: 6720m, alertname: ApiBudgetSlowBurn, exp_alerts: [] }
