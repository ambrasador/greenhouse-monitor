# Спільні кроки завдань: Node.js потрібної версії й залежності за lock-файлом
name: setup
description: Node.js 22 і npm ci

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 22.23.4
        cache: npm
    # без скриптів встановлення: у залежностях їх мають лише esbuild, @parcel/watcher і
    # вкладений protobufjs, і жоден з них для тестів не потрібен
    - run: npm ci --ignore-scripts
      shell: bash
