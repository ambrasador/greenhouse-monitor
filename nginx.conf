# Вебсервер для клієнта й проксі до API. /metrics назовні не віддається
# Ім’я backend перерозв’язується DNS Docker кожні 5 с. З буквальним
# proxy_pass http://backend:3000 nginx запам’ятовує адресу при старті,
# і після перестворення контейнера відповідає 502 до reload
resolver 127.0.0.11 valid=5s;

server {
  listen 80;
  root /usr/share/nginx/html;
  set $backend http://backend:3000;

  location / {
    try_files $uri $uri/ =404;
  }

  # REST і SSE: потрібні вимкнена буферизація й тайм-аут, довший за паузи
  # між подіями
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Socket.IO: перехід на WebSocket і той самий довгий тайм-аут
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
